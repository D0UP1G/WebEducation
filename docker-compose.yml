services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webeducation}
      POSTGRES_USER: ${POSTGRES_USER:-webeducation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webeducation}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://webeducation:webeducation@db:5432/webeducation}
    command: ["/app/backend/entrypoint.sh"]
    volumes:
      - media_data:/app/backend/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://webeducation:webeducation@db:5432/webeducation}
    command: ["python", "manage.py", "run_grading_worker"]
    depends_on:
      db:
        condition: service_healthy

  proxy:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    image: webeducation-proxy:local
    ports:
      - "${PROXY_PORT:-8080}:80"
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
